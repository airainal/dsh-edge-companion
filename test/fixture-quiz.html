<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>DSH Edge Bridge 自测页</title>
<style>
  body { font: 14px/1.7 "Segoe UI", "Microsoft YaHei", sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  .q { border: 1px solid #ddd; border-radius: 10px; padding: 12px 16px; margin: 12px 0; }
  .q h3 { margin: 0 0 6px; font-size: 14px; color: #666; font-weight: 500; }
  label { display: block; padding: 3px 0; cursor: pointer; }
  #btn { margin-top: 8px; padding: 8px 18px; border: 0; border-radius: 8px; background: #4d6bfe; color: #fff; }
  #out { margin-top: 10px; color: #0a7; }
  input[type="text"] { width: 100%; padding: 7px 9px; border: 1px solid #ccc; border-radius: 7px; }
</style>
</head>
<body>
  <h1>DSH Edge Bridge 自测页</h1>
  <p id="intro">用于验证 snapshot / questions / fill-answers / click / fill / eval / cdp 全链路。本页不会提交任何东西。</p>

  <div class="q" data-qid="1">
    <h3>1-1 判断题</h3>
    <div class="mt-4">
      <p>1 + 1 = 2</p>
      <label><input type="radio" name="q1" value="T" /> T</label>
      <label><input type="radio" name="q1" value="F" /> F</label>
    </div>
  </div>

  <div class="q" data-qid="2">
    <h3>1-2 单选题</h3>
    <div class="mt-4">
      <p>下列哪个是浏览器调试协议？</p>
      <label><input type="radio" name="q2" value="A" /> A. HTTP</label>
      <label><input type="radio" name="q2" value="B" /> B. CDP</label>
      <label><input type="radio" name="q2" value="C" /> C. FTP</label>
    </div>
  </div>

  <div class="q" data-qid="3">
    <h3>1-3 多选题</h3>
    <div class="mt-4">
      <p>以下哪些是 DeepSeek Harness 的能力？</p>
      <label><input type="checkbox" name="q3" value="A" /> A. 工具调用</label>
      <label><input type="checkbox" name="q3" value="B" /> B. 子代理</label>
      <label><input type="checkbox" name="q3" value="C" /> C. 烧水</label>
    </div>
  </div>

  <div class="q">
    <h3>表单</h3>
    <p><input id="nick" type="text" placeholder="输入昵称" /></p>
    <button id="btn" type="button" onclick="document.getElementById('out').textContent = 'clicked:' + (document.getElementById('nick').value || '(空)')">点我</button>
    <div id="out"></div>
  </div>
</body>
</html>
